# CI/CD: typecheck en cada push/PR; build + deploy a Cloud Run en cada push a main.
# Configuración (GitHub → Settings → Secrets and variables → Actions → Variables):
#   GCP_PROJECT_ID, GCP_REGION, WIF_PROVIDER, DEPLOY_SA, RUNTIME_SA
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_APP_URL
#   RESEND_FROM_EMAIL, STRIPE_PRICE_ID, TRIAL_DAYS, PLAN_PRICE_LABEL, PLATFORM_FEE_PERCENT
# Los secretos NO van en GitHub: viven en Secret Manager (ver scripts/gcp-setup.ps1).
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Workload Identity Federation (sin llaves JSON)

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  deploy:
    needs: check
    # no despliega hasta que existan las Variables de GCP (scripts/gcp-setup.ps1)
    if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      SERVICE: estimates
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/estimates/estimates:${{ github.sha }}
      # se leen como variables de entorno para que valores con "$" o "," no se rompan en bash
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
      STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
      TRIAL_DAYS: ${{ vars.TRIAL_DAYS }}
      PLAN_PRICE_LABEL: ${{ vars.PLAN_PRICE_LABEL }}
      PLATFORM_FEE_PERCENT: ${{ vars.PLATFORM_FEE_PERCENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --build-arg NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy
        run: |
          # "^|^" cambia el separador de --set-env-vars a "|" (los valores pueden llevar comas)
          ENV_VARS="^|^NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY|NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL|RESEND_FROM_EMAIL=$RESEND_FROM_EMAIL|STRIPE_PRICE_ID=$STRIPE_PRICE_ID|TRIAL_DAYS=${TRIAL_DAYS:-14}|PLAN_PRICE_LABEL=${PLAN_PRICE_LABEL:-\$100}|PLATFORM_FEE_PERCENT=${PLATFORM_FEE_PERCENT:-0}"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "${{ vars.RUNTIME_SA }}" \
            --allow-unauthenticated \
            --port 8080 --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 10 --concurrency 80 \
            --set-env-vars "$ENV_VARS" \
            --set-secrets "SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,RESEND_API_KEY=resend-api-key:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-connect-webhook-secret:latest,STRIPE_BILLING_WEBHOOK_SECRET=stripe-billing-webhook-secret:latest" \
            --quiet
          echo "URL: $(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format='value(status.url)')"
